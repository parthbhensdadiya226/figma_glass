name: iOS simulator

# Runs the example's gallery test on an iPhone simulator and uploads a
# screenshot of every demo. Start it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; d = json.load(sys.stdin)['devices']; print(next(x['udid'] for runtime, devices in d.items() if 'iOS' in runtime for x in devices if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl list devices booted
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run the gallery test
        working-directory: example
        run: |
          flutter pub get
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/gallery_test.dart \
            -d "$UDID"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: example/screenshots/
          if-no-files-found: warn
